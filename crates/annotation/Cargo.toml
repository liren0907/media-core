[package]
name = "annotation"
version = "0.1.0"
edition = "2021"
description = "Draws object-detection results (boxes and labels from a detection JSON) on every frame of a video"

[dependencies]
opencv = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.38"
lazy_static = "1.4.0"


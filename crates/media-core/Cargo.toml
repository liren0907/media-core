[package]
name = "media_core"
version = "0.4.0"
edition = "2024"

[lib]
name = "media_core"
path = "src/lib.rs"

[[bin]]
name = "media_core"
path = "src/main.rs"

[[bin]]
name = "streaming"
path = "src/bin/streaming.rs"

[[bin]]
name = "process"
path = "src/bin/process.rs"

[[bin]]
name = "video_process"
path = "src/bin/video_process.rs"

[[bin]]
name = "pipeline_camera"
path = "src/bin/pipeline_camera.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "annotation"
path = "src/bin/annotation.rs"

[[bin]]
name = "rtsp_sync"
path = "src/bin/rtsp_sync.rs"

[[bin]]
name = "rtsp"
path = "src/bin/rtsp.rs"

[[bin]]
name = "hls"
path = "src/bin/hls.rs"

[[bin]]
name = "analysis"
path = "src/bin/analysis.rs"

[[bin]]
name = "metadata"
path = "src/bin/metadata.rs"

[dependencies]
# Dependencies from media_core crate
opencv = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
rayon = "1.8"
num_cpus = "1.16"
path-clean = "1.0"
serde_path_to_error = "0.1"
serde_json = "1.0"
regex = "1.10"
base64 = "0.22"
walkdir = "2.4"
prettytable-rs = "0.10"
lazy_static = "1.4"
thiserror = "2.0.17"

# Dependencies from rtsp_stream_extractor
rfd = "0.14.1"
m3u8-rs = "5.0.4"
tempfile = "3.8.0"
